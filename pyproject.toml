[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amstabase"
version = "1.0.0"
description = "Interne Rezeptdatenbank und Speisekartenverwaltung"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4",
    "Flask-Login>=0.6,<1",
    "bcrypt>=4.1,<6",
    "bleach>=6.1,<7",
    "python-dotenv>=1.0,<2",
    "WeasyPrint>=62,<71",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.9,<1",
]
production = ["gunicorn>=22,<24"]

[tool.setuptools.packages.find]
include = ["amstabase*"]

[tool.setuptools.package-data]
amstabase = ["schema.sql", "templates/**/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["amstabase"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
